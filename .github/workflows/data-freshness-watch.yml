# 지난 날짜 주간 감시 — '다음 갱신 예정'이 지났는데 아직 옛 자료인 줄(또는 화면 분기 섞임)을 사람에게 알린다
#
# 왜: 화면 아래 "이 자료는 언제 것인가" 표는 자료마다 다음 갱신 예정일을 규칙으로 계산해
#     보여 준다. 그런데 그 날짜가 지나도 **아무도 안 본다** — 실제로 건축 인허가는 지난
#     날짜가 22일간 떠 있었다(2026-10-01 발견). 화면은 손님에게 "지났습니다"라고 적고,
#     이 워크플로는 **사장님께 이슈로** 알린다(같은 기준: 예정일 < 한국 날짜의 오늘).
#
# 무엇을 하나: 매주 한 번 공개키로 `api.get_data_freshness()` 를 읽어, 예정일 지난 자료가
#     있으면 **자료 하나에 이슈 하나**를 연다. 각주 뷰 `api.v_coverage_stats` 도 읽어 화면 분기가
#     섞였으면(결정 0035) 고정 제목 이슈 하나를 더 연다. 그게 전부다 — 받는 것·적재는 사람이 로컬에서 한다.
#
# ⛔ 이 워크플로는 **창고(Supabase)에 쓰지 않는다.** 읽기 전용 공개 함수 하나와 공개 뷰 하나만 읽는다.
#
# ⓘ 비밀값(Secrets)은 **0개**다. 의견함 주간 알림과 **같은 저장소 변수(Variables)** 두 개를
#    쓴다 — 이미 배포된 화면의 자바스크립트 묶음에 실려 있어 누구나 볼 수 있는 값이다.
#
# ⓘ 덤으로 **창고가 죽은 것도 주 단위로 드러난다** — 조회가 실패하면 아래 실패 알림 이슈가
#    열린다(6시간 간격의 라이브 생존 감시만큼 촘촘하지는 않다).
#
# ⚠️ GitHub 는 저장소에 60일간 활동이 없으면 예약 실행을 자동으로 멈춘다.
#    그 경우는 스스로 못 알리므로 형제 감시들이 이 워크플로를 대신 지켜본다.
name: 지난 날짜 주간 감시

on:
  schedule:
    # 매주 월요일 02:00 UTC = 11:00 KST. 주 1회 형제들이 00:00·00:30·01:00·01:30 UTC,
    # 라이브 생존 감시가 매 6시간 10분(`10 */6`)이라 비켜 간다 — 같은 시각에 몰리면 큐가
    # 밀릴 때 함께 드롭된다.
    - cron: "0 2 * * 1"
  # 손으로 즉시 돌려보고 싶을 때 (Actions 탭 → Run workflow)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # 형제 감시의 **실행 기록**을 읽어야 그쪽 예약이 살아 있는지 볼 수 있다.
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul # 로컬(KST)과 시간축 통일
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ⚠️ 변수가 없으면 job 을 **실패시키지는 않는다.** 여기서 죽이면 아래 상호 감시
      #    단계가 통째로 안 돌아, 형제 감시가 죽어도 이 워크플로가 못 알린다
      #    (2026-08-10 사고가 정확히 그 형태였다 — 앞 단계 실패가 뒤 단계를 삼켰다).
      #
      # ⛔ **그렇다고 조용히 넘어가서도 안 된다.** 건너뛰어도 job 은 '성공'으로 기록되므로,
      #    형제 감시들 눈에는 멀쩡해 보이는 채로 **지난 날짜를 영영 안 보는 상태**가
      #    계속된다. 그래서 다음 단계에서 이슈를 연다(의견함 주간 알림과 같은 처방).
      - name: 창고 주소·공개키가 있나
        id: creds
        env:
          SUPA_URL: ${{ vars.SANGGA_SUPABASE_URL }}
          SUPA_KEY: ${{ vars.SANGGA_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPA_URL:-}" ] || [ -z "${SUPA_KEY:-}" ]; then
            echo "저장소 변수 SANGGA_SUPABASE_URL / SANGGA_SUPABASE_ANON_KEY 가 없습니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 열려 있는 같은 제목이 있으면 건너뛴다 → 사람이 변수를 넣고 닫으면 끝난다.
      - name: 변수가 없으면 그 사실을 알린다
        if: steps.creds.outputs.ready == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="지난 날짜 주간 감시가 꺼져 있습니다 — 저장소 변수 두 개가 필요합니다"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "이미 열린 같은 이슈가 있습니다 — 건너뜁니다."
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file .github/data-freshness-setup-issue.md
          echo "이슈를 열었습니다: $TITLE"

      # 스크립트는 표준 라이브러리만 쓴다 — 설치 단계가 없다.
      #
      # ⚠️ 종료코드 1 은 실패가 아니라 **"예정일 지난 자료 또는 화면 분기 섞임이 있다"**는 뜻이다. 조회 자체가
      #    실패하면 2(변수 없음은 3 — 위 단계가 먼저 가르므로 여기선 안 나온다).
      #    `continue-on-error` 로 뭉뚱그리면 둘을 못 가려 **창고가 죽은 것이 조용히 묻힌다** —
      #    그래서 여기서 손수 가른다(LH 공고 감시와 같은 형태).
      #
      # ⛔ 한 겹 더: 1 인데 **자료별 이슈 파일이 하나도 없으면** 실패로 친다. 스크립트가
      #    잡지 못한 예외로 죽어도 파이썬은 1 로 끝나는데, 그걸 "지남"으로 읽으면 이슈도
      #    실패 알림도 없이 초록이 된다.
      # ⛔ 두 겹 더: 1 인데 GITHUB_OUTPUT 에 `overdue=true` 줄이 없어도 실패다. 이슈 파일을
      #    다 쓴 뒤 그 기록에서 죽으면 파일은 있는데 아래 이슈 단계(`overdue == 'true'`)가
      #    건너뛰어져 조용히 초록이 된다(스크립트는 그 경우 4 를 내지만 한 번 더 막는다).
      - name: 예정일 지난 자료 또는 화면 분기 섞임이 있는지 확인
        id: check
        if: steps.creds.outputs.ready == 'true'
        env:
          SANGGA_SUPABASE_URL: ${{ vars.SANGGA_SUPABASE_URL }}
          SANGGA_SUPABASE_ANON_KEY: ${{ vars.SANGGA_SUPABASE_ANON_KEY }}
        run: |
          set +e
          python scripts/check_data_freshness.py
          rc=$?
          set -e
          if [ "$rc" -eq 1 ] && ! ls data_freshness_issues/*.md >/dev/null 2>&1; then
            echo "종료코드 1 인데 자료별 이슈 파일이 없습니다 — 스크립트가 도중에 죽은 것으로 봅니다."
            exit 1
          fi
          if [ "$rc" -eq 1 ] && ! grep -Fxq 'overdue=true' "$GITHUB_OUTPUT"; then
            echo "종료코드 1 인데 overdue=true 기록이 없습니다 — 도중에 죽은 것으로 봅니다."
            exit 1
          fi
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
            exit 0
          fi
          # 4 = 조회는 됐는데 결과를 쓰다 실패 — 조회 실패(2)와 다른 말로 알린다(LH 공고 감시와 같다).
          if [ "$rc" -eq 4 ]; then
            echo "조회는 됐는데 결과를 쓰다 실패했습니다 (종료코드 4) — 알림이 안 나갔을 수 있습니다."
            exit 4
          fi
          echo "신선도 조회에 실패했습니다 (종료코드 $rc)."
          exit "$rc"

      # 지난 자료 **하나에 이슈 하나**(화면 분기 섞임은 고정 제목 이슈 하나 — 같은 폴더의 쌍). 제목(NN.title)은 자료 이름 + 예정일뿐이라(며칠
      # 지났나·건수 같은 변하는 값 없음) 하나를 적재해도 **남은 자료의 제목은 그대로**다.
      # **열려 있는** 같은 제목이 있으면 그 자료만 건너뛴다 → 열어 둔 동안은 조용하고,
      # 아직 밀린 채로 닫으면 다음 주에 다시 알린다.
      # ⛔ 자료 이름은 창고가 준 값이다 — `${{ }}` 로 run 에 끼우지 않고 파일로만 읽는다.
      - name: 지난 자료·화면 분기 섞임마다 이슈를 연다
        if: steps.check.outputs.overdue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          OPEN_TITLES="$(gh issue list --state open --limit 200 --json title --jq '.[].title')"
          for body in data_freshness_issues/*.md; do
            TITLE="$(cat "${body%.md}.title")"
            # here-string 으로 넘긴다 — 파이프 + pipefail 이면 grep -q 가 먼저 끝날 때 앞쪽이
            # SIGPIPE 로 실패해 "열린 이슈 없음"으로 읽힐 수 있다(그러면 같은 이슈가 또 열린다).
            if grep -Fxq -- "$TITLE" <<< "$OPEN_TITLES"; then
              echo "이미 열린 같은 이슈가 있습니다 — 건너뜁니다: $TITLE"
              continue
            fi
            {
              cat "$body"
              echo
              echo "이 알림을 만든 실행: $RUN_URL"
            } > data_freshness_issue_full.md
            gh issue create --title "$TITLE" --body-file data_freshness_issue_full.md
            echo "이슈를 열었습니다: $TITLE"
          done

      # ── 상호 감시 ────────────────────────────────────────────────────────
      # 여기까지 왔다는 건 **내 예약은 살아 있다**는 뜻이다. 그 김에 형제 감시들이 아직
      # 도는지 본다 — 예약이 아예 안 도는 경우(60일 무활동 자동중지·큐 드롭)는 실패조차
      # 없어서 그쪽 워크플로우 스스로는 절대 알릴 수 없기 때문이다.
      #
      # continue-on-error 인 이유: 이 점검이 못 돌았다고 job 을 실패시키면 아래 failure()
      # 가 "지난 날짜 감시가 실패했습니다"라는 **엉뚱한 이슈**를 연다.
      # `if: !cancelled()` 가 없으면 **내 본연의 감시가 실패한 주에는 형제를 안 본다** —
      # 앞 단계가 실패하면 job status 가 failure 라 뒤 단계가 통째로 건너뛰어진다.
      - name: 형제 감시들이 아직 도는지 확인
        id: heartbeat
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # ⛔ 고장을 가른다. continue-on-error 가 실패를 삼키므로 job 은 초록으로 남지만, 이 단계가
          #    0 아닌 코드로 끝나면 outcome 이 failure 가 되어 아래 "점검이 고장 났으면" 단계가 알린다.
          #    1 = 멈춘 감시가 있음 — 이슈 본문 파일과 stale=true 기록이 **둘 다** 있어야 진짜 1 이다
          #    (잡지 못한 예외로 죽어도 파이썬은 1 로 끝난다). 2 = 조회·판정 실패 · 4 = 결과 쓰기 실패.
          set +e
          python scripts/check_watch_heartbeat.py --workflow sangkwon-quarterly-watch.yml --workflow district-source-watch.yml --workflow live-health-watch.yml --workflow feedback-digest.yml --workflow lh-notice-watch.yml
          rc=$?
          set -e
          if [ "$rc" -eq 1 ] && [ ! -f watch_heartbeat_issue.md ]; then
            echo "종료코드 1 인데 이슈 본문 파일이 없습니다 — 도중에 죽은 것으로 봅니다."
            exit 1
          fi
          if [ "$rc" -eq 1 ] && ! grep -Fxq 'stale=true' "$GITHUB_OUTPUT"; then
            echo "종료코드 1 인데 stale=true 기록이 없습니다 — 도중에 죽은 것으로 봅니다."
            exit 1
          fi
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
            exit 0
          fi
          if [ "$rc" -eq 4 ]; then
            echo "조회는 됐는데 결과를 쓰다 실패했습니다 (종료코드 4) — 멈춘 감시 알림이 안 나갔을 수 있습니다."
            exit 4
          fi
          echo "상호 감시 조회에 실패했습니다 (종료코드 $rc)."
          exit "$rc"

      # 제목에 날짜가 없으므로 **열려 있는** 같은 제목만 건너뛴다 →
      # 사람이 닫아야 다음 사고를 다시 알린다.
      - name: 형제 감시가 멈췄으면 이슈를 연다
        if: ${{ !cancelled() && steps.heartbeat.outputs.stale == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.heartbeat.outputs.title }}
        run: |
          set -euo pipefail
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "이미 열린 같은 이슈가 있습니다 — 건너뜁니다: $TITLE"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file watch_heartbeat_issue.md
          echo "이슈를 열었습니다: $TITLE"

      # 하트비트 점검 **자체**가 고장 나면(조회 실패·결과 쓰기 실패·도중에 죽음) 위 단계는
      # continue-on-error 라 job 이 초록이고 stale 기록도 없어 아무도 모른다 — 그래서 따로 알린다.
      # `outcome` 을 보는 이유: `conclusion` 은 continue-on-error 가 적용된 **뒤**라 늘 success 다
      # (outcome = 적용 전 결과 — GitHub 문서 "Contexts reference · steps context").
      # 제목이 여섯 감시에서 글자까지 같아 같은 고장은 한 이슈로 묶이고, **열려 있는** 동안은
      # 다시 안 연다 → 사람이 확인·조치 뒤 닫아야 다음 고장을 다시 알린다.
      - name: 상호 감시 점검이 고장 났으면 이슈를 연다
        if: ${{ !cancelled() && steps.heartbeat.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="상호 감시 점검(하트비트)이 결과를 내지 못했습니다 — 사람이 직접 확인해 주세요"
          OPEN_TITLES="$(gh issue list --state open --limit 100 --json title --jq '.[].title')"
          # here-string 으로 넘긴다 — 파이프 + pipefail 이면 grep -q 가 먼저 끝날 때 앞쪽이
          # SIGPIPE 로 실패해 "열린 이슈 없음"으로 읽힐 수 있다(그러면 같은 이슈가 또 열린다).
          if grep -Fxq -- "$TITLE" <<< "$OPEN_TITLES"; then
            echo "이미 열린 같은 이슈가 있습니다 — 건너뜁니다: $TITLE"
            exit 0
          fi
          {
            cat .github/watch-heartbeat-failure-issue.md
            echo
            echo "이 알림을 만든 실행: $RUN_URL"
          } > watch_heartbeat_failure_issue.md
          gh issue create --title "$TITLE" --body-file watch_heartbeat_failure_issue.md
          echo "이슈를 열었습니다: $TITLE"

      # 감시가 **실패하면 이슈가 안 열린다.** 그런데 아무도 Actions 탭을 들여다보지
      # 않으므로, 창고가 죽었거나 함수가 바뀌어도 아무 신호가 없다 — 조용한 실패가
      # 지난 날짜를 다시 "아무도 안 보는" 상태로 되돌리는 두 번째 경로다. 그래서 실패
      # 자체도 이슈로 시끄럽게 만든다(의견함 주간 알림·LH 공고 감시와 같은 형태).
      - name: 감시가 실패하면 그 사실을 이슈로 알린다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="지난 날짜 주간 감시가 실패했습니다 — 사람이 직접 확인해 주세요"
          # 매주 같은 이슈가 쌓이면 알림이 소음이 되고, 소음은 무시된다.
          # **열려 있는** 같은 제목이 있으면 건너뛴다 → 닫아야 다음 실패를 다시 알린다.
          if gh issue list --state open --limit 100 --json title \
               --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "이미 열린 실패 이슈가 있습니다 — 건너뜁니다: $TITLE"
            exit 0
          fi
          {
            cat .github/data-freshness-failure-issue.md
            echo
            echo "실패한 실행: $RUN_URL"
          } > data_freshness_failure_issue.md
          gh issue create --title "$TITLE" --body-file data_freshness_failure_issue.md
          echo "실패 알림 이슈를 열었습니다: $TITLE"
