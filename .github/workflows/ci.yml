name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul  # 로컬(KST)과 시간축 통일 — 시간대 flaky 방지
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        # ruff는 로컬과 동일 버전 고정 — 버전 차이로 규칙 셋이 달라져 로컬 통과·CI 실패가 갈리는 것 방지
        run: pip install pytest==9.1.1 ruff==0.15.9 requests python-dotenv
      - name: Lint
        run: python -m ruff check scripts/ tests/
      - name: Test
        run: python -m pytest tests/ -q

  # 프론트엔드 검사. 없으면 타입 오류가 그대로 머지된다 — PR #9로 React 앱이 들어온 뒤
  # 이 job이 없어서 src/**가 CI 사각지대였다(2026-08-08 적대검증에서 발견).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # package.json에 packageManager가 없어 명시한다. 로컬과 메이저를 맞춘다.
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec oxlint
      # 화면 로직 테스트(vitest). 예전에는 러너 자체가 없어서 지하층 표기·선택 잔존 같은
      # 결함이 lint·build를 그대로 통과했다(2026-08-08 적대검증에서 라이브로 발견).
      - name: Test
        run: pnpm test
      # E2E(playwright): 검색→선택→층 스택이 실제 브라우저에서 이어 붙는지.
      # 네트워크는 전부 가로채므로(mock) DB 비밀값이 필요 없다. chromium 하나만 설치.
      - name: Install Playwright (Chromium only)
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E test
        run: pnpm test:e2e
      # build가 `tsc -b && vite build`라 타입 검사까지 함께 돈다.
      - name: Typecheck + build
        run: pnpm build
